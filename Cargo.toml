[workspace]
members = [
    "crates/agent-core",
    "crates/llm-client",
    "crates/coding-agent",
    "crates/coding-agent-plugin-sdk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Automata Contributors"]
license = "MIT"
repository = "https://github.com/fully-automatic-io/automata"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }

# Lint gate — clippy's default `all` group at warn, inherited by every crate
# via `[lints] workspace = true`. The tree is clippy-clean; keep it that way.
[workspace.lints.clippy]
all = "warn"
