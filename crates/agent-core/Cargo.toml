[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
authors = ["Automata Contributors"]
description = "Core agent framework for building AI agents"
license = "MIT"
repository = "https://github.com/yourusername/automata"
keywords = ["ai", "agent", "llm", "framework"]
categories = ["development-tools"]

[dependencies]
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
serde_yaml = "0.9"
regex = "1"

tempfile = "3"
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[[example]]
name = "basic_agent"
path = "../../examples/basic_agent.rs"
