[package]
name = "coding-agent"
version.workspace = true
edition.workspace = true
authors = ["Automata Contributors"]
description = "Coding agent implementation with file operations and bash execution"
license = "MIT"
repository = "https://github.com/yourusername/automata"
keywords = ["ai", "agent", "coding", "automation"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
agent-core = { path = "../agent-core" }
llm-client = { path = "../llm-client" }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
tracing = "0.1"
similar = "2"
regex = "1"
ignore = "0.4"
globset = "0.4"
tempfile = "3"
lazy_static = "1.5"
unicode-normalization = "0.1"
dirs-next = "2"
image = "0.25"
mime_guess = "2.0"
base64 = "0.22"
extism = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio-test = "0.4"

[[example]]
name = "coding_agent"
path = "../../examples/coding_agent.rs"

[[example]]
name = "coding_session"
path = "../../examples/coding_session.rs"

[[example]]
name = "deepseek_coding_agent"
path = "../../examples/deepseek_coding_agent.rs"

[[example]]
name = "multi_turn_chat"
path = "../../examples/multi_turn_chat.rs"
